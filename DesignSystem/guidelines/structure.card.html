<!-- @dsCard group="Structure" viewport="700x290" name="App frame" subtitle="Rail 44 · command bar 34 · content · status bar 26. Fixed, never scrolls." -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Frame</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding:12px; background:var(--color-page); }
  .cap { font-size:var(--text-label); font-weight:var(--weight-semibold); text-transform:uppercase; letter-spacing:var(--tracking-label); color:var(--color-text-muted); }
  .rw { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .note { font-size:var(--text-meta); color:var(--color-text-faint); }
  .mono { font-family:var(--font-mono); font-size:10px; color:var(--color-text-faint); }

</style>
</head>
<body>
<div style="border:1px solid var(--color-border-strong);height:230px;display:grid;grid-template-columns:44px 1fr;grid-template-rows:34px 1fr 26px">
  <div style="grid-row:span 3;background:var(--chrome-bg);border-right:1px solid var(--chrome-border);display:flex;flex-direction:column;align-items:center;padding:5px 0;gap:3px">
    <span class="c-mark" style="margin-bottom:4px">EI</span>
    <span style="width:17px;height:17px;border-radius:2px;background:var(--chrome-text-faint);opacity:0.4"></span><span style="width:17px;height:17px;border-radius:2px;background:var(--color-accent);opacity:1"></span><span style="width:17px;height:17px;border-radius:2px;background:var(--chrome-text-faint);opacity:0.4"></span><span style="width:17px;height:17px;border-radius:2px;background:var(--chrome-text-faint);opacity:0.4"></span><span style="width:17px;height:17px;border-radius:2px;background:var(--chrome-text-faint);opacity:0.4"></span>
  </div>
  <div style="background:var(--chrome-bg);border-bottom:1px solid var(--chrome-border);display:flex;align-items:center;padding:0 10px;gap:8px">
    <span style="font-size:11px;color:var(--chrome-text-bright);font-weight:600">Products</span>
    <span style="font-size:10px;color:var(--chrome-text-faint)">52,817 items</span>
    <span style="flex:1"></span>
    <span style="font-size:10px;color:var(--chrome-text-faint)">search · ⌘K</span>
    <span style="height:18px;padding:0 8px;background:var(--color-accent);color:var(--color-accent-on);font-size:10px;font-weight:600;display:flex;align-items:center;border-radius:2px">Primary</span>
  </div>
  <div style="display:grid;grid-template-columns:1fr 200px;min-height:0">
    <div style="display:flex;flex-direction:column">
      <div style="height:24px;background:var(--color-surface-alt);border-bottom:1px solid var(--color-border-strong)"></div>
      <div style="height:20px;border-bottom:1px solid var(--color-border);border-left:3px solid transparent;background:var(--color-surface)"></div><div style="height:20px;border-bottom:1px solid var(--color-border);border-left:3px solid var(--state-warn);background:var(--color-surface-alt)"></div><div style="height:20px;border-bottom:1px solid var(--color-border);border-left:3px solid transparent;background:var(--color-surface)"></div><div style="height:20px;border-bottom:1px solid var(--color-border);border-left:3px solid var(--state-bad);background:var(--color-surface-alt)"></div><div style="height:20px;border-bottom:1px solid var(--color-border);border-left:3px solid transparent;background:var(--color-surface)"></div><div style="height:20px;border-bottom:1px solid var(--color-border);border-left:3px solid transparent;background:var(--color-surface-alt)"></div>
      <div style="flex:1"></div>
      <div style="height:26px;background:var(--color-surface-alt);border-top:1px solid var(--color-border)"></div>
    </div>
    <div style="border-left:1px solid var(--color-border);display:flex;flex-direction:column">
      <div style="height:28px;background:var(--color-surface-alt);border-bottom:1px solid var(--color-border)"></div>
      <div style="flex:1;background:var(--color-surface)"></div>
    </div>
  </div>
  <div style="background:var(--chrome-bg);border-top:1px solid var(--chrome-border);display:flex;align-items:center;padding:0 10px;gap:8px">
    <span style="font-size:10px;color:var(--chrome-text-faint)">Online · Drawer #1 · C. MacLeod</span>
    <span style="flex:1"></span>
    <span style="font-size:10px;color:var(--chrome-text-faint)">F2 New · F9 Products · ⌘K Search</span>
  </div>
</div>
<p class="note" style="margin-top:8px">There is no page gutter and no gap between panels. Regions are separated by one 1px rule. Anything that would have been a floating card is a panel that fills its region.</p>
</body></html>
